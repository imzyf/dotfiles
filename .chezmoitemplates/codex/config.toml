{{- /* Upstream config plus the local model override; dot_codex/modify_private_config.toml merges the result. */ -}}
{{- $upstream := includeTemplate "codex/upstream.config.toml" . -}}
{{- $modelPattern := `(?m)^model = "[^"]+"$` -}}
{{- if ne (len (regexFindAll $modelPattern $upstream -1)) 1 }}{{ fail "codex/upstream.config.toml no longer contains exactly one top-level model assignment; update the override in codex/config.toml" }}{{ end -}}
{{ regexReplaceAllLiteral $modelPattern $upstream `model = "gpt-5.6-sol"` -}}
